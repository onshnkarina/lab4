name: Publish version on release

on:
  release:
    types: [published]   # Запуск только при публикации релиза

permissions:
  contents: write        # Разрешение на пуш

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Switch to gh-pages branch
        run: |
          git fetch
          git checkout gh-pages

      - name: Copy website to version folder
        run: |
          VERSION="v${{ github.event.release.tag_name }}"
          mkdir -p $VERSION
          cp -R index.html en ru $VERSION/

      - name: Commit and push versioned site
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Add version $VERSION" || echo "No changes to commit"
          git push origin gh-pages
